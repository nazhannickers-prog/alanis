<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alanis Stay | Marang, Terengganu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: white; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1b4d3e; text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .price-box { background: #e8f5e9; padding: 20px; border-radius: 8px; text-align: center; margin-top: 25px; margin-bottom: 25px; }
        .price-box h3 { margin: 0; color: #2e7d32; font-size: 18px; }
        .price-box .amount { font-size: 32px; font-weight: bold; color: #1b5e20; margin-top: 10px; }
        button { background-color: #25d366; color: white; border: none; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Alanis Stay</h1>
    <p class="subtitle">Marang, Terengganu • Cozy Standard Homestay</p>

    <div class="form-group">
        <label for="roomType">Select Stay Package:</label>
        <select id="roomType">
            <option value="250">Full House (Standard) - RM250 / night</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nights">Number of Nights:</label>
        <input type="number" id="nights" value="1" min="1" max="30">
    </div>

    <div class="price-box">
        <h3>Estimated Total Price</h3>
        <div class="amount" id="totalPrice">RM 250.00</div>
    </div>

    <button onclick="sendWhatsApp()">Book via WhatsApp</button>
</div>

<script>
    const roomSelect = document.getElementById('roomType');
    const nightsInput = document.getElementById('nights');
    const totalPriceDisplay = document.getElementById('totalPrice');

    function updatePrice() {
        let pricePerNight = parseInt(roomSelect.value);
        let nights = parseInt(nightsInput.value) || 1;
        let total = pricePerNight * nights;
        totalPriceDisplay.textContent = 'RM ' + total.toFixed(2);
    }

    roomSelect.addEventListener('change', updatePrice);
    nightsInput.addEventListener('input', updatePrice);

    function sendWhatsApp() {
        let roomName = roomSelect.options[roomSelect.selectedIndex].text;
        let nights = nightsInput.value;
        let total = totalPriceDisplay.textContent;
        
        let phoneNumber = "60108233774"; // Nombor WhatsApp anda
        let message = `Hello Alanis Stay, I would like to make a booking:\n\n* Package: ${roomName}\n* Duration: ${nights} night(s)\n* Estimated Total: ${total}\n\nPlease check availability. Thank you!`;
        
        let url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
