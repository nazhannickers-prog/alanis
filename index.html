<!-- Bahagian Kod Borang Tempahan & Kalkulator Interaktif -->
<div class="booking-card" style="background: #173F3A; color: #F6F0E7; padding: 30px; border-radius: 12px; max-width: 600px; font-family: sans-serif;">
    <h3 style="color: #CBA45D; margin-bottom: 10px;">Semak Tarikh & Kira Anggaran Kos</h3>
    <p style="font-size: 14px; margin-bottom: 20px;">Pilih bilangan malam penginapan anda di Alanis Stay, Marang.</p>
    
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Kadar Asas Semalam:</label>
        <div style="font-size: 24px; color: #CBA45D; font-weight: bold;">RM 250.00</div>
    </div>

    <div style="margin-bottom: 20px;">
        <label for="nightsInput" style="display: block; margin-bottom: 5px;">Bilangan Malam:</label>
        <input type="number" id="nightsInput" value="1" min="1" max="30" style="padding: 10px; width: 100%; border-radius: 6px; border: 1px solid #CBA45D; background: #F6F0E7; color: #173F3A; font-size: 16px;">
    </div>

    <div style="margin-bottom: 25px; padding: 15px; background: rgba(203, 164, 93, 0.1); border-radius: 8px; border: 1px dashed #CBA45D;">
        <span style="font-size: 16px;">Anggaran Jumlah Keseluruhan:</span>
        <div id="totalPriceDisplay" style="font-size: 28px; font-weight: bold; color: #CBA45D; margin-top: 5px;">RM 250.00</div>
    </div>

    <button type="button" onclick="sendWhatsAppBooking()" style="background-color: #CBA45D; color: #173F3A; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;">
        Tempah Sekarang via WhatsApp
    </button>
</div>

<!-- Skrip Pengiraan & Sambungan WhatsApp -->
<script>
    const nightsInput = document.getElementById('nightsInput');
    const totalPriceDisplay = document.getElementById('totalPriceDisplay');
    const pricePerNight = 250;

    // Fungsi Kira Harga Automatik
    function updateTotalPrice() {
        let nights = parseInt(nightsInput.value) || 1;
        let total = nights * pricePerNight;
        totalPriceDisplay.textContent = 'RM ' + total.toLocaleString() + '.00';
    }

    nightsInput.addEventListener('input', updateTotalPrice);

    // Fungsi Hantar Mesej ke WhatsApp
    function sendWhatsAppBooking() {
        let nights = nightsInput.value;
        let total = totalPriceDisplay.textContent;
        
        // Gantikan nombor di bawah dengan nombor WhatsApp anda (format antarabangsa tanpa '+' atau '-')
        let phoneNumber = "60108233774"; 
        
        let message = `Hai Alanis Stay, saya ingin membuat tempahan homestay:\n\n* Tempoh: ${nights} Malam\n* Anggaran Kos: ${total}\n\nMohon semak kekosongan tarikh. Terima kasih!`;
        
        let whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        window.open(whatsappURL, '_blank');
    }
</script>
